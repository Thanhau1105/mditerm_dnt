name: vku_student_management
description: "VKU Student Management — Flutter Web/Android và MongoDB."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
          weight: 400
        - asset: assets/fonts/Roboto.ttf
          weight: 500
        - asset: assets/fonts/Roboto.ttf
          weight: 600
        - asset: assets/fonts/Roboto.ttf
          weight: 700
        - asset: assets/fonts/Roboto.ttf
          weight: 800
